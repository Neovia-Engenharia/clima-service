spring.application.name=clima-service

# Banco de dados (SQL Server): só por variável de ambiente, sem valor padrão
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Hibernate 6 mapeia Instant para datetimeoffset; as migrations usam DATETIME2 (o plano do S1). Esta propriedade
# devolve o mapeamento para TIMESTAMP (datetime2 no SQL Server), sem mexer no DDL.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.default_schema=clima
# sem open-in-view: entidades lidas antes da trava não podem vazar para a transação travada
spring.jpa.open-in-view=false

# Flyway
spring.flyway.schemas=clima
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history_clima

# Redis (a saúde do serviço não depende dele)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.timeout=2s
management.health.redis.enabled=false
management.endpoint.health.probes.enabled=true

# Nimbus (API Cronos)
nimbus.base-url=${NIMBUS_BASE_URL:https://cronos-api.nimbusmeteorologia.com.br}
nimbus.api-key=${NIMBUS_API_KEY}
nimbus.authorization=${NIMBUS_AUTHORIZATION}
nimbus.connect-timeout=5s
nimbus.read-timeout=10s

# Spring DOC
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true

# Jackson: instantes em ISO-8601 (2026-10-15T12:00:00Z)
spring.jackson.serialization.write-dates-as-timestamps=false
